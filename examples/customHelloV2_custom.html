<!DOCTYPE html>
<html lang="en">
	<head>
   <!--
      In this version, we create our own web page rather than the one generated by the compile:
         emcc hello.c -s STANDALONE_WASM -o hello.wasm -o hello.js
      We simply need to execute the javascript file previously created in the hello.c compile,
      as shown here below.
      To see the output in the console using the Firefox browser, 
      simply hit the f12 key to bring up the developers panels and look under the console tab.
      p.s.: the Web Developer Tools of Firefox allow you to examine the js and wasm files as well as your HTML  page.
   
   -->
		<meta charset="utf-8"/>
		<title>HelloV2</title>
      <script src="helloV2.js"></script>
      <script>
         function squareIt(number)
         {
            console.log("The square of " + number + " is " + number*number);
         }
      </script>
	</head>
	<body>
		<p>Open the console to see the result! (f12)</p>
	</body>
</html>
