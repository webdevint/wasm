<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<title>Fibonacci2</title>
      <script>
      const wasiMock = 
           {
              fd_write: (fd, iovs, iovs_len, nwritten) => 0,
              fd_close: (fd) => 0,
              fd_seek: (fd, offset_base, offset_high, whence, newoffset) => 0,
              fd_read: (fd, iovs, iovs_len, nread) => 0,
              environ_sizes_get: (environ_count, environ_buf_size) => 0,
              environ_get: (environ, environ_buf) => 0,
              proc_exit: (rval) => {},
              main: () => main() // may be required here if you specify a main in your c code
         };
         const importObject = 
         {
           wasi_snapshot_preview1: wasiMock
         };

            WebAssembly.instantiateStreaming(fetch("fibonacciV2.wasm"), importObject).then(
            (obj) => 
               {
                  // Call an exported function:
                  var result = obj.instance.exports.fib(6);
                  console.log("fib = " + result);
               }
            );
      </script
	</head>
	<body>
		<p>Open the console to see the result! (f12)</p>
	</body>
</html>
